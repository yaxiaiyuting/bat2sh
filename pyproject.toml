[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bat2sh"
version = "1.0.0"
description = "将 Windows 批处理与 PowerShell 脚本转换为 Bash 脚本（PySide6 图形界面 + CLI）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bat2sh contributors" }]
dependencies = ["PySide6>=6.5"]

[project.scripts]
bat2sh = "bat2sh.__main__:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
bat2sh = ["data/*.svg"]
