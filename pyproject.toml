[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bat2sh"
version = "1.10.0b1"
description = "将 Windows 批处理与 PowerShell 脚本转换为 Bash 脚本（PySide6 图形界面 + CLI）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "bat2sh contributors" }]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bat2sh = "bat2sh.__main__:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
bat2sh = ["data/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
# 避免在仓库根目录留下 .pytest_cache（.gitignore 暂未收录）
addopts = "-p no:cacheprovider"
